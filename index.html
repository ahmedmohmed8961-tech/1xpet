<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التواصل مع الأدمن</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 450px;
    }

    .title-area {
      text-align: center;
      margin-bottom: 24px;
    }

    .title-area h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
    }

    .title-area p {
      font-size: 14px;
      color: #64748b;
      margin-top: 6px;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .admin-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .admin-meta {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #0284c7;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }

    .admin-text h3 {
      font-size: 16px;
      color: #1e293b;
      font-weight: 700;
    }

    .admin-text span {
      font-size: 12px;
      color: #0284c7;
      display: block;
      margin-top: 2px;
      font-weight: 500;
    }

    .btn-action {
      background-color: #e0f2fe;
      color: #0284c7;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-action:hover {
      background-color: #bae6fd;
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    .alert-box {
      margin-top: 20px;
      background-color: #fff1f2;
      border: 1px solid #ffe4e6;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #e11d48;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="title-area">
      <h1>الأدمن المسؤولين</h1>
      <p>دول الأدمن الرسميين بس — تواصل مع واحد منهم</p>
    </div>

    <div class="card-list">
      <!-- الأدمن الأول -->
      <div class="admin-card">
        <div class="admin-meta">
          <div class="avatar-icon">?</div>
          <div class="admin-text">
            <h3>DR.MERO</h3>
            <span>أدمن رسمي — بيرد بسرعة</span>
          </div>
        </div>
        <a href="https://t.me/yanrj_12222" target="_blank" class="btn-action">تواصل ↗</a>
      </div>

      <!-- الأدمن الثاني -->
      <div class="admin-card">
        <div class="admin-meta">
          <div class="avatar-icon">?</div>
          <div class="admin-text">
            <h3>DR. YOUSEF</h3>
            <span>أدمن رسمي — بيرد بسرعة</span>
          </div>
        </div>
        <a href="https://t.me/yanrj_12222" target="_blank" class="btn-action">تواصل ↗</a>
      </div>

      <!-- الأدمن الثالث -->
      <div class="admin-card">
        <div class="admin-meta">
          <div class="avatar-icon">K</div>
          <div class="admin-text">
            <h3>KAREEM</h3>
            <span>أدمن رسمي — بيرد بسرعة</span>
          </div>
        </div>
        <a href="https://t.me/yanrj_12222" target="_blank" class="btn-action">تواصل ↗</a>
      </div>
    </div>

    <div class="alert-box">
      <span>⚠️</span>
      <span>اللي هيبعت لأكثر من أدمن في نفس الوقت بياخد حظر يا شباب!</span>
    </div>
  </div>

</body>
</html>
